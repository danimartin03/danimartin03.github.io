    <g transform="translate(250 440)"><rect x="-110" y="-34" width="220" height="68" rx="34" fill="#0B3C5D" stroke="#9DB7C8" stroke-opacity=".4" stroke-width="2"/><text y="7">Alexa</text></g>
    <g transform="translate(1030 440)"><rect x="-110" y="-34" width="220" height="68" rx="34" fill="#0B3C5D" stroke="#9DB7C8" stroke-opacity=".4" stroke-width="2"/><text y="7">Google Home</text></g>
    <g transform="translate(460 610)"><rect x="-110" y="-34" width="220" height="68" rx="34" fill="#0B3C5D" stroke="#9DB7C8" stroke-opacity=".4" stroke-width="2"/><text y="7">Google Nest</text></g>
