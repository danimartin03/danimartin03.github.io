<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace">
  <!-- Ilustración propia: una imagen grande que sale más ligera por el otro lado. -->
  <rect width="1280" height="720" fill="#072B43"/>
  <g fill="none" stroke="#9DB7C8" stroke-opacity=".14" stroke-width="2">
    <path d="M0 180h1280M0 360h1280M0 540h1280M320 0v720M640 0v720M960 0v720"/>
  </g>

  <!-- Imagen original, grande -->
  <g transform="translate(150 150)">
    <rect width="440" height="330" rx="14" fill="#0B3C5D" stroke="#9DB7C8" stroke-opacity=".5" stroke-width="3"/>
    <circle cx="330" cy="92" r="38" fill="#FFC72C"/>
    <path d="M24 306 160 150l86 96 62-58 108 118z" fill="#EAF2F7" fill-opacity=".9"/>
    <path d="M24 306 160 150l52 58-74 98z" fill="#9DB7C8"/>
  </g>

  <!-- Flecha -->
  <g fill="none" stroke="#FFC72C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M640 315h150" stroke-dasharray="2 16"/>
    <path d="M800 285l34 30-34 30"/>
  </g>

  <!-- Imagen convertida, más pequeña -->
  <g transform="translate(890 217)">
    <rect width="240" height="180" rx="12" fill="#0B3C5D" stroke="#FFC72C" stroke-width="3"/>
    <circle cx="180" cy="50" r="21" fill="#FFC72C"/>
    <path d="M13 167 87 82l47 52 34-32 59 65z" fill="#EAF2F7" fill-opacity=".9"/>
    <path d="M13 167 87 82l28 32-40 53z" fill="#9DB7C8"/>
  </g>

  <!-- Formatos -->
  <g font-size="24" font-weight="700" text-anchor="middle">
    <g transform="translate(415 590)"><rect x="-70" y="-30" width="140" height="60" rx="30" fill="#FFC72C"/><text y="9" fill="#072B43">WebP</text></g>
    <g transform="translate(565 590)" fill="#EAF2F7"><rect x="-70" y="-30" width="140" height="60" rx="30" fill="#0B3C5D" stroke="#9DB7C8" stroke-opacity=".4" stroke-width="2"/><text y="9">JPG</text></g>
    <g transform="translate(715 590)" fill="#EAF2F7"><rect x="-70" y="-30" width="140" height="60" rx="30" fill="#0B3C5D" stroke="#9DB7C8" stroke-opacity=".4" stroke-width="2"/><text y="9">PNG</text></g>
    <g transform="translate(865 590)" fill="#EAF2F7"><rect x="-70" y="-30" width="140" height="60" rx="30" fill="#0B3C5D" stroke="#9DB7C8" stroke-opacity=".4" stroke-width="2"/><text y="9">ICO</text></g>
  </g>
</svg>
